services:
  - type: web
    name: python-web-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://arjun939201.github.io
      - key: SANDBOX_EXECUTION_ENABLED
        value: "false"
